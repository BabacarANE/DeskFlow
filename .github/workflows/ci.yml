name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore DeskFlow.slnx
      - run: dotnet format DeskFlow.slnx --verify-no-changes --no-restore
      - run: dotnet build DeskFlow.slnx --no-restore -c Release
      - run: dotnet test DeskFlow.slnx --no-build -c Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run e2e:typecheck
      - run: npm test -- --no-watch
      - run: npm run build
      - run: npm run check:no-mock

  docker:
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker build -f docker/dotnet.Dockerfile --build-arg PROJECT=Desk.Api -t deskflow-api .
          docker build -f docker/dotnet.Dockerfile --build-arg PROJECT=Desk.Worker -t deskflow-worker .
          docker build -f docker/web.Dockerfile -t deskflow-web .

  e2e:
    # Real stack (docker compose), real browser: never the mock. Independent of the other jobs to stay fast.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Create .env from .env.example with generated secrets
        run: |
          cp .env.example .env
          sed -i "s|^JWT_KEY=.*|JWT_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^RABBITMQ_PASSWORD=.*|RABBITMQ_PASSWORD=$(openssl rand -hex 16)|" .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(web/package-lock.json) }}
      - name: Install Chromium
        working-directory: web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run E2E tests
        working-directory: web
        run: npm run e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop the stack
        if: always()
        run: docker compose down -v
