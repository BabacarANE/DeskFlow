server {
  listen 80;
  root /usr/share/nginx/html;

  # SignalR hub: the browser sends the JWT in the query string (access_token), so the access log
  # is off here to keep the token out of `docker logs` (ADR 009).
  location /hubs/ {
    access_log off;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # Same site for the SPA and the API, so the SameSite=Lax refresh cookie works (SPEC section 5).
  location ~ ^/(api|health|signin-google|signin-github)(/|$) {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
